site_name: Canefinder
site_description: Pathfinder 1e house rules
docs_dir: docs
# The shared class feature lists are data: hooks/class_features.py renders them into the role pages.
exclude_docs: |
  campaign-systems/class-features/
repo_url: https://github.com/canefinderhouserules/Canefinderhouserules
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - content.action.edit
    - navigation.tabs
    - navigation.top
    - navigation.prune
    - navigation.indexes
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
plugins:
  - search
  - awesome-nav
markdown_extensions:
  - tables
  - toc
  - admonition
  - pymdownx.details
hooks:
  - hooks/class_features.py
  - hooks/trim_search.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/section-preview.js
  - javascripts/deep-search-link.js
  - javascripts/deep-search.js
  - javascripts/spell-search.js
  - javascripts/item-search.js
  - javascripts/class-feature-search.js
  - javascripts/archetype-picker.js
  - javascripts/action-points.js
  - javascripts/condition-links.js
  - javascripts/roll20-export.js
